# Netlify build configuration.
#
# Deliberately MINIMAL. Netlify detects Next.js from package.json and installs
# its Next.js Runtime automatically, and that runtime owns the publish
# directory and the serverless wiring.
#
# An earlier version of this file pinned `publish = ".next"` and declared
# `@netlify/plugin-nextjs` by hand. That produced a site that answered
# "Page not found": with the publish directory pinned, `.next` was served as a
# plain static folder, and `.next` has no index.html at its root. Letting the
# runtime set it is the documented path — don't add either line back.
#
# ⚠️  NOTHING SECRET GOES IN THIS FILE. It is committed, so anything here is
#     public. The Supabase anon key below is public BY DESIGN — it is the key
#     browsers are meant to hold, and Row Level Security is what protects the
#     data (verified: anon can neither read, insert, nor mark orders paid — see
#     docs/supabase-setup.md).
#
#     These four go in the Netlify UI as environment variables, never here:
#       SUPABASE_SERVICE_ROLE_KEY   bypasses RLS entirely
#       RESEND_API_KEY              sends email as your domain
#       PAYFAST_MERCHANT_KEY        takes money
#       PAYFAST_PASSPHRASE          signs the requests that take money

[build]
  # Branch deploys and deploy previews each get their own URL, so they should
  # build with it rather than inheriting the production one below — otherwise a
  # branch deploy writes the preview site's address into its own sitemap and
  # into any link it generates. Netlify sets CONTEXT and DEPLOY_PRIME_URL for
  # us; production is left alone so it keeps the real domain once one is bought.
  command = 'if [ "$CONTEXT" != production ]; then export NEXT_PUBLIC_SITE_URL="$DEPLOY_PRIME_URL"; fi; npm run build'

[build.environment]
  NODE_VERSION = "22"

  # Next.js inlines every NEXT_PUBLIC_* value at BUILD time, not at run time.
  # Leaving these to the UI means the first build bakes in empty strings and
  # the site silently behaves as though Supabase does not exist.
  NEXT_PUBLIC_SUPABASE_URL = "https://jxlybljgrbszfrvwlcep.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY = "sb_publishable_vY4d8HxlNVzOOk8LGd4Urg_D4BHvsCD"

  # Production only — branch deploys and previews override this with their own
  # URL in the build command above. Change it when the real domain is pointed
  # here. Used for PayFast return URLs, email links and the sitemap.
  NEXT_PUBLIC_SITE_URL = "https://okuhle-preview.netlify.app"
